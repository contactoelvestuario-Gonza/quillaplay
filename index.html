<!DOCTYPE html>
<html>
<head>
  <title>QullaPlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; background:#111; color:white; text-align:center; }
    button { padding:10px; margin:5px; }
    input, select { padding:8px; margin:5px; }
    .card { background:#222; padding:15px; margin:10px; border-radius:8px; }
  </style>
</head>
<body>

<h1>QullaPlay ⚽</h1>

<h2>Crear Partido</h2>

<select id="categoria">
  <option>Primera</option>
  <option>Reserva</option>
  <option>Senior</option>
</select>

<select id="zona">
  <option>A</option>
  <option>B</option>
</select>

<input type="text" id="local" placeholder="Equipo Local">
<input type="text" id="visitante" placeholder="Equipo Visitante">
<br>
<button onclick="crearPartido()">Crear Partido</button>

<hr>

<h2>Partidos en Juego</h2>
<div id="partidos"></div>

<script>
const supabase = window.supabase.createClient(
  "https://rckddwxsgldzwvxzcsjv.supabase.co",
  "sb_publishable_0iVGcqTlUk9vzKiMyXhJEA__gsh4tnS"
);

async function crearPartido() {
  const categoria = document.getElementById("categoria").value;
  const zona = document.getElementById("zona").value;
  const local = document.getElementById("local").value;
  const visitante = document.getElementById("visitante").value;

  await supabase.from("partidos").insert([
    { categoria, zona, local, visitante }
  ]);

  cargarPartidos();
}

async function cargarPartidos() {
  const { data } = await supabase
    .from("partidos")
    .select("*")
    .order("created_at", { ascending:false });

  let html = "";

  data.forEach(p => {
    html += `
      <div class="card">
        <h3>${p.local} ${p.goles_local} - ${p.goles_visitante} ${p.visitante}</h3>
        <p>Estado: ${p.estado}</p>

        ${p.estado === "En juego" ? `
          <input type="number" placeholder="Minuto" id="min_${p.id}">
          <input type="text" placeholder="Jugador" id="jug_${p.id}">
          <select id="equipo_${p.id}">
            <option value="${p.local}">${p.local}</option>
            <option value="${p.visitante}">${p.visitante}</option>
          </select>
          <button onclick="gol('${p.id}')">Agregar Gol</button>
          <br>
          <button onclick="finalizar('${p.id}')">Finalizar Partido</button>
        ` : `<strong>PARTIDO FINALIZADO</strong>`}
      </div>
    `;
  });

  document.getElementById("partidos").innerHTML = html;
}

async function gol(id) {
  const minuto = document.getElementById("min_"+id).value;
  const jugador = document.getElementById("jug_"+id).value;
  const equipo = document.getElementById("equipo_"+id).value;

  const { data: partido } = await supabase
    .from("partidos")
    .select("*")
    .eq("id", id)
    .single();

  if (equipo === partido.local) {
    await supabase.from("partidos")
      .update({ goles_local: partido.goles_local + 1 })
      .eq("id", id);
  } else {
    await supabase.from("partidos")
      .update({ goles_visitante: partido.goles_visitante + 1 })
      .eq("id", id);
  }

  await supabase.from("eventos").insert([
    { partido_id:id, minuto, jugador, equipo, tipo:"Gol" }
  ]);

  cargarPartidos();
}

async function finalizar(id) {
  const { data: partido } = await supabase
    .from("partidos")
    .select("*")
    .eq("id", id)
    .single();

  await supabase.from("partidos")
    .update({ estado:"Finalizado" })
    .eq("id", id);

  // Actualizar tabla posiciones
  let puntosLocal = 0;
  let puntosVisitante = 0;

  if (partido.goles_local > partido.goles_visitante) puntosLocal = 3;
  else if (partido.goles_local < partido.goles_visitante) puntosVisitante = 3;
  else { puntosLocal = 1; puntosVisitante = 1; }

  await actualizarTabla(partido.local, partido, puntosLocal, partido.goles_local, partido.goles_visitante);
  await actualizarTabla(partido.visitante, partido, puntosVisitante, partido.goles_visitante, partido.goles_local);

  cargarPartidos();
}

async function actualizarTabla(equipo, partido, puntos, gf, gc) {

  const { data } = await supabase
    .from("posiciones")
    .select("*")
    .eq("equipo", equipo)
    .eq("categoria", partido.categoria)
    .eq("zona", partido.zona);

  if (data.length === 0) {
    await supabase.from("posiciones").insert([{
      equipo,
      categoria: partido.categoria,
      zona: partido.zona,
      puntos,
      jugados:1,
      ganados: puntos===3?1:0,
      empatados: puntos===1?1:0,
      perdidos: puntos===0?1:0,
      goles_favor:gf,
      goles_contra:gc
    }]);
  } else {
    const actual = data[0];
    await supabase.from("posiciones").update({
      puntos: actual.puntos + puntos,
      jugados: actual.jugados + 1,
      ganados: actual.ganados + (puntos===3?1:0),
      empatados: actual.empatados + (puntos===1?1:0),
      perdidos: actual.perdidos + (puntos===0?1:0),
      goles_favor: actual.goles_favor + gf,
      goles_contra: actual.goles_contra + gc
    }).eq("id", actual.id);
  }
}

cargarPartidos();
</script>

</body>
</html>
